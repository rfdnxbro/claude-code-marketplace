[tool.ruff]
# Python linter/formatter 設定
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# デフォルトルールセット + 追加ルール
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    # E501はformatterが分割できない要素（長い文字列リテラル・日本語コメント・URL）に
    # のみ残り、--fixの対象外のためCIで自動修復できない。行長はline-lengthに委ねる。
    "E501",
]

[tool.ruff.format]
# フォーマット設定
quote-style = "double"
indent-style = "space"
