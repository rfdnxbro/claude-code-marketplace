name: Lint

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'
      - 'pyproject.toml'
      - '.yamllint.yml'
      - '.markdownlint.json'
  workflow_dispatch:

jobs:
  python-lint:
    name: Python (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: uvをセットアップ
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # バージョンは .pre-commit-config.yaml の ruff-pre-commit rev と揃える。
      # 未固定にすると、ruffの更新（例: Markdown内コードブロックの整形対象化）で
      # 「ローカルのpre-commitは通るがCIだけ落ちる」状態が突然発生する。
      - name: Ruff check
        run: uvx ruff@0.14.10 check scripts/

      - name: Ruff format check
        run: uvx ruff@0.14.10 format --check scripts/

  yaml-lint:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: uvをセットアップ
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: yamllint
        run: uvx yamllint -c .yamllint.yml .github/workflows/

  markdown-lint:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: markdownlint
        run: |
          npx markdownlint-cli --config .markdownlint.json \
            README.md \
            CLAUDE.md \
            scripts/README.md \
            '.claude/rules/*.md' \
            '.claude/skills/**/SKILL.md'
