name: Claude Code CHANGELOG監視

on:
  schedule:
    # 毎日日本時間9:00（UTC 0:00）に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: '前回チェックを無視して強制実行'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: changelog-monitor
  cancel-in-progress: false

jobs:
  monitor-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: 前回のCHANGELOGスナップショットを復元
        uses: actions/cache/restore@v6
        with:
          path: .changelog-snapshot.md
          key: changelog-snapshot-${{ github.run_id }}
          restore-keys: |
            changelog-snapshot-

      - name: 最新のCHANGELOGを取得
        id: fetch
        run: |
          if curl --retry 3 --retry-delay 5 -fsSL https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md -o current-changelog.md; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "取得完了: $(wc -l < current-changelog.md) 行"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "::error::CHANGELOGの取得に失敗しました"
            exit 1
          fi

      - name: 前回のCHANGELOGと比較
        id: check-diff
        run: |
          if [ -f .changelog-snapshot.md ]; then
            if diff -q .changelog-snapshot.md current-changelog.md > /dev/null 2>&1; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "is_first_run=false" >> $GITHUB_OUTPUT
              echo "CHANGELOGに変更はありません"
              # force_check用に空のdiffファイルを作成
              echo "変更なし" > changelog-diff.txt
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "is_first_run=false" >> $GITHUB_OUTPUT
              echo "CHANGELOGに変更を検出しました"
              diff .changelog-snapshot.md current-changelog.md > changelog-diff.txt || true
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "is_first_run=true" >> $GITHUB_OUTPUT
            echo "::warning::前回のスナップショットが見つかりませんでした（初回実行、またはキャッシュ失効の可能性）。現在のCHANGELOGでスナップショットを再作成するため、この間の変更は検出されずスキップされます"
            echo "初回実行のため差分なし" > changelog-diff.txt
          fi

      - name: claude-code-updateラベルを作成（存在しない場合）
        if: (steps.check-diff.outputs.changed == 'true' && steps.check-diff.outputs.is_first_run == 'false') || inputs.force_check
        run: |
          # ラベルが存在しない場合のみ作成
          if ! gh label list --json name -q '.[].name' | grep -q '^claude-code-update$'; then
            gh label create claude-code-update \
              --description "Claude Codeのアップデートによる新機能・変更への対応" \
              --color "6f42c1"
            echo "ラベル claude-code-update を作成しました"
          else
            echo "ラベル claude-code-update は既に存在します"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Claudeで変更を解析しIssueを作成
        id: claude-analysis
        if: (steps.check-diff.outputs.changed == 'true' && steps.check-diff.outputs.is_first_run == 'false') || inputs.force_check
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # allowed-tools: Issueは検証付きの起票スクリプト経由でしか作れないよう、gh issue create は許可しない。
          # disallowed-tools: 起票スクリプトと、スクリプトが照合する current-changelog.md を書き換えて
          #   検証を素通りさせられないよう塞ぐ。Edit ルールは Write を含む全ファイル編集ツールに効く
          #   （Write(path) ではパスを絞れない）。Write が要るのは /tmp のタイトル・本文だけ。
          claude_args: >-
            --max-turns 40
            --allowed-tools "Bash(bash .github/scripts/create-changelog-issue.sh:*),Bash(gh issue list:*),
            Read,Write,Grep,Glob"
            --disallowed-tools "Edit(/.github/**),Edit(/current-changelog.md)"
          prompt: |
            あなたはClaude Codeマーケットプレイスのメンテナーです。

            ## タスク
            Claude Code公式リポジトリのCHANGELOGを解析し、プラグイン関連の変更があれば対応してください。

            ## ファイル
            - current-changelog.md: 最新のCHANGELOG
            - .changelog-snapshot.md: 前回チェック時点のCHANGELOG
            - changelog-diff.txt: 差分情報

            ## 実行手順

            1. changelog-diff.txtを読んで、差分の概要を把握
            2. current-changelog.mdを読んで、プラグイン関連の変更候補を特定
            3. .claude/rules/contribution-guide.md の「Claude Code アップデート時の追跡方針」に従い、各変更を追跡対象/対象外に分類
            4. .claude/rules/README.md を読んで、現在のドキュメント構造を把握
            5. 必要に応じて .claude/rules/ 配下の関連ドキュメントを確認
            6. 追跡対象の変更がある場合:
               a. 下の「バージョンの照合」に従い、Issueに挙げる各項目の版数を確定する
               b. 下の「Issueの作成方法」に従い、変更内容をまとめたIssueを作成する
               c. 【重要】PRは作成しないでください。Issueのみ作成し、実装は別のCIに任せます
            7. 追跡対象の変更がない場合:
               a. 「追跡対象のプラグイン関連変更なし」と報告して終了

            ## バージョンの照合
            起票時に版数を取り違える例があった（v2.1.290 の内容が v2.1.291 として起票された）。
            Issueを書く前に、次の手順で版数を確かめること。

            - current-changelog.md の見出しは「## 2.1.290」の形式で、新しいバージョンが上にある
            - changelog-diff.txt は diff の出力なので、項目の行と見出しの行が離れていたり、
              見出しが含まれていなかったりする。差分の並びから版数を推測しない
            - Issueに挙げる項目ごとに、current-changelog.md の中でその項目の行を探し、
              そこから上に遡って最初に現れる「## 」見出しをその項目の版数とする
              （Grepで項目の文言と「^## 」を行番号付きで検索して突き合わせる）
            - タイトルの版数は、Issueに挙げた項目が実際に属する見出しの版数にする
              - 全項目が1つの見出しの下にある場合: 「v2.1.290」
              - 複数の見出しにまたがる場合: 「v2.1.290-v2.1.291」（古い版-新しい版の順）
            - Issue本文でも、各項目にその項目が属する見出しの版数を書く。
              タイトルの版数と本文の版数が食い違わないこと
            - タイトルを決めたら、Issueに挙げた全項目が本当にタイトルの版数の見出しの下に
              あるかを、current-changelog.md でもう一度確かめる

            ## Issueの作成方法
            `gh issue create` は直接実行できない。必ず次の手順で作成する。

            1. Writeツールで、Issueタイトルを1行で `/tmp/changelog-issue-title.txt` に書き込む
               - 形式は「[CHANGELOG v2.1.290] 概要」または「[CHANGELOG v2.1.290-v2.1.291] 概要」
            2. Writeツールで、Issue本文を `/tmp/changelog-issue.md` に書き込む
            3. `bash .github/scripts/create-changelog-issue.sh` を実行する
               - タイトルの形式と、版数の見出しが current-changelog.md に実在するかを確かめてから、
                 ラベル claude-code-update を付けて `--body-file` でIssueを作成する
                 （ラベルにより自動実装CIがトリガーされる。`--body` だとシェルエスケープの問題で
                 本文が欠落するため、本文は必ずファイルで渡す）
               - エラーが出たらIssueは作成されていない。メッセージに従って「バージョンの照合」を
                 やり直し、タイトル・本文を直してから再実行する
               - 見出しの実在は確かめられても、項目がその見出しの下にあるかまでは確かめられない。
                 項目と見出しの対応は、実行前に自分で確かめること

            ## 重要
            - 変更があった場合のみIssueを作成（PRは作成しない）
            - Issueにはどのバージョンでどのような変更があったかを明記
            - Issueタイトルは「[CHANGELOG vX.X.X] 」で始める形式にする
            - 不明確な変更は「要確認」としてマーク

      - name: スナップショットをキャッシュに保存
        if: steps.check-diff.outputs.is_first_run == 'true' || steps.claude-analysis.outcome == 'success'
        run: cp current-changelog.md .changelog-snapshot.md

      - name: キャッシュを保存
        if: steps.check-diff.outputs.is_first_run == 'true' || steps.claude-analysis.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .changelog-snapshot.md
          key: changelog-snapshot-${{ github.run_id }}
