name: Claude Code自動更新対応

on:
  issues:
    types: [labeled]
  # ラベルの付け外し以外に再実行手段がないと、失敗したIssueを再試行するたびに
  # Issueのタイムラインがラベル操作で埋まるため、手動トリガーを用意する
  workflow_dispatch:
    inputs:
      issue_number:
        description: 対象のIssue番号
        required: true
        type: string
      label:
        description: 実装の種別
        required: true
        type: choice
        options:
          - claude-code-update
          - plugin-update

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: auto-implement-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  auto-implement:
    # claude-code-updateまたはplugin-updateラベルが付いたissueに反応する。
    # workflow_dispatchの場合は種別をinputsで受け取るためラベル判定は行わない。
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'claude-code-update'
      || github.event.label.name == 'plugin-update'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # issues.labeled と workflow_dispatch のどちらが起点でも
      # 以降のステップが同じ値を参照できるようにジョブ単位で解決しておく
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      TARGET_LABEL: ${{ github.event.label.name || inputs.label }}
    steps:
      # workflow_dispatchのissue_numberは自由入力のため、ブランチ名や
      # gh issue view に渡す前に数値であることを確認する
      - name: 入力値を検証
        run: |
          # grepは行単位で照合するため "123\nfoo" のような複数行入力を通してしまう。
          # caseは文字列全体を見るので、改行を含む値をここで弾ける。
          case "${ISSUE_NUMBER}" in
            "" | *[!0-9]*)
              echo "::error::Issue番号が数値ではありません"
              exit 1
              ;;
          esac
          case "${TARGET_LABEL}" in
            claude-code-update | plugin-update) ;;
            *)
              echo "::error::対応していない種別です: ${TARGET_LABEL}"
              exit 1
              ;;
          esac
          echo "✓ 対象: Issue #${ISSUE_NUMBER}（種別: ${TARGET_LABEL}）"

      - name: ラベル付与者の権限チェック
        run: |
          echo "ラベル付与者: ${SENDER}"

          # OWNERまたは信頼できるボットのみ許可
          TRUSTED_BOTS=("github-actions[bot]" "dependabot[bot]" "claude[bot]")

          # ボット判定
          for BOT in "${TRUSTED_BOTS[@]}"; do
            if [ "${SENDER}" = "${BOT}" ]; then
              echo "✓ 信頼できるボット: ${SENDER}"
              exit 0
            fi
          done

          # リポジトリオーナー判定（GitHub APIで確認）
          PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${SENDER}/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "権限レベル: ${PERMISSION}"

          if [ "${PERMISSION}" = "admin" ]; then
            echo "✓ リポジトリオーナー: ${SENDER}"
            exit 0
          fi

          echo "::error::ラベル付与者 ${SENDER} にはオーナー権限がありません（権限: ${PERMISSION}）"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatchでもsenderは入るが、念のためactorにフォールバックする
          SENDER: ${{ github.event.sender.login || github.actor }}

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Claudeの検証用（Bash(uvx *)）と、PR作成前のテスト実行の両方でuvxを使う
      - name: uvをセットアップ
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: pre-commitキャッシュを復元
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: pre-commitをセットアップ
        run: |
          pip install pre-commit
          pre-commit install

      - name: シークレット検証
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN が設定されていません"
            exit 1
          fi
          echo "✓ 必要なシークレットが設定されています"

      - name: ラベルに基づく設定を決定
        id: config
        run: |
          LABEL="${TARGET_LABEL}"

          if [ "$LABEL" = "claude-code-update" ]; then
            echo "branch_prefix=auto/claude-code-update" >> $GITHUB_OUTPUT
            echo "pr_label=documentation" >> $GITHUB_OUTPUT
            echo "target_type=docs" >> $GITHUB_OUTPUT
          elif [ "$LABEL" = "plugin-update" ]; then
            echo "branch_prefix=auto/plugin-update" >> $GITHUB_OUTPUT
            echo "pr_label=plugin" >> $GITHUB_OUTPUT
            echo "target_type=plugin" >> $GITHUB_OUTPUT
          fi

          echo "ラベル: $LABEL"

      - name: 作業ブランチを作成
        id: branch
        run: |
          BRANCH_NAME="${{ steps.config.outputs.branch_prefix }}-issue-${ISSUE_NUMBER}"
          echo "name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          # ローカルブランチが既に存在する場合は削除
          if git rev-parse --verify "${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "既存ローカルブランチを削除します: ${BRANCH_NAME}"
            git branch -D "${BRANCH_NAME}" || true
          fi

          git checkout -b "${BRANCH_NAME}"
          echo "作業ブランチを作成しました: ${BRANCH_NAME}"

      # 前回失敗時に付与されたラベルを実行開始時に外す。
      # 今回も失敗すれば末尾の通知ステップが付け直すため、
      # 「解決済みのIssueにラベルが残り続ける」状態を防ぐ。
      - name: 前回の失敗ラベルを除去
        continue-on-error: true
        run: |
          gh issue edit "${ISSUE_NUMBER}" \
            --remove-label auto-implement-failed 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Issueの内容を取得
        id: issue
        run: |
          # Issue本文をファイルに保存
          gh issue view "${ISSUE_NUMBER}" --json title,body --jq '.body' > issue-body.md
          gh issue view "${ISSUE_NUMBER}" --json title --jq '.title' > issue-title.txt
          # タイトルをoutputにも保存（後のステップで使用）
          echo "title=$(cat issue-title.txt | tr -d '\n')" >> $GITHUB_OUTPUT
          echo "取得完了: Issue #${ISSUE_NUMBER}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Claudeで実装を実行（claude-code-update）
        if: env.TARGET_LABEL == 'claude-code-update'
        id: claude-implement-docs
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: 'claude'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはClaude Codeマーケットプレイスのソフトウェアエンジニアです。

            ## タスク
            Issue #${{ env.ISSUE_NUMBER }} の内容に基づいて、必要な実装を行ってください。

            ## Issue情報
            - タイトル: (issue-title.txtを参照)
            - 本文: (issue-body.mdを参照)

            ## 実行手順

            1. issue-title.txtとissue-body.mdを読んで、Issueの内容を把握
            2. CLAUDE.mdを読んで、プロジェクトのガイドラインを把握
            3. .claude/rules/README.md を読んで、ドキュメント構造の全体像を把握
            4. 必要に応じて .claude/rules/ 配下の関連ドキュメントを読む
            5. scripts/validators/ 配下のバリデーターを確認（__init__.py でエクスポート一覧を確認）
            6. 必要な変更を特定し、以下を実装:
               a. ドキュメント更新（.claude/rules/*.md）
               b. バリデーター更新（scripts/validators/*.py）
               c. テスト更新（scripts/tests/*.py）
            7. 実装完了後、pre-commitを実行してlint/formatエラーをチェック
               - `pre-commit run --all-files` を実行
               - エラーがあれば内容を確認し、該当ファイルを修正
               - 再度pre-commitを実行し、すべてパスするまで繰り返す
               - Pythonの1行は100桁以内に収める。長い日本語コメントや文字列リテラルは
                 formatterが折り返さないため、自分で分割すること
            8. すべてのチェックがパスしたら、変更内容のサマリーを /tmp/change-summary.txt に書き出す
               - 変更したファイル一覧と各ファイルの変更概要を箇条書きで記載
               - 例: "- .claude/rules/README.md: 用語集にPRFAQ、DDDを追加"
            9. 変更が不要と判断した場合は、その判断理由を /tmp/no-change-reason.txt に書き出す
               - Issueが挙げた項目ごとに、なぜ変更が不要かを箇条書きで記載
               - 既に対応済みの場合は該当するファイルパスと記述箇所を必ず示す
               - 例: "- backgroundフィールド: .claude/rules/skill-authoring.md に記載済み"
               - 「特になし」「問題なし」のような根拠のない記述はしないこと

            ## プロジェクト構造
            - CLAUDE.md: プロジェクトのガイドライン（必読）
            - .claude/rules/: プラグイン仕様ドキュメント（README.mdに索引あり）
            - scripts/validators/: バリデーター実装
            - scripts/tests/: テストコード

            ## 重要
            - CLAUDE.mdのガイドラインに従う
            - 既存のコードスタイルを維持
            - 新機能を追加する場合は対応するテストも追加
            - scripts/validators/ にコードを追加・変更した場合は、対応するテストで
              カバレッジ100%を維持すること（CIで --cov-fail-under=100 が課されている）
            - 破壊的変更がある場合は明確にコメントを残す
            - 不明確な部分は「TODO: 要確認」としてマーク
            - リポジトリに永続的に必要なファイルのみ作成・変更すること
            - issue-body.md, issue-title.txt などの一時ファイルは参照のみで、変更やコミットに含めないこと

          # permission-mode: このリポジトリのルールドキュメントは .claude/rules/ にあり、
          #   .claude はClaude Codeの「保護パス」なので既定では書き込みが必ず承認待ちになる。
          #   ヘッドレス実行には承認する相手がいないため拒否され、実装が成立しなかった。
          #   allow ルールは保護パスより後に評価されるため効かず、bypassPermissions が唯一の手段。
          # disallowed-tools: bypassPermissions でも deny ルールは有効なので、
          #   次回以降の実行を乗っ取れるファイル（hooks・ワークフロー・設定）だけを塞ぐ。
          #   Edit ルールは Write を含む全ファイル編集ツールに効く。
          # allowed-tools: uvx/npx のワイルドカードは任意コード実行に等しく、
          #   deny ルールはサブプロセスの書き込みには効かないため実際に使うコマンドへ絞る。
          # max-turns: 実測で成功38〜46 turns、失敗は一律51（上限50に到達）だったため引き上げる。
          claude_args: >-
            --max-turns 80
            --permission-mode bypassPermissions
            --allowed-tools "Read,Grep,Glob,Edit,Write,
            Bash(uvx pytest*),Bash(uvx --with pytest-cov pytest*),Bash(uvx ruff*),
            Bash(python3 scripts/*),Bash(pre-commit run*)"
            --disallowed-tools "Edit(/.claude/settings.json),
            Edit(/.claude/settings.local.json),Edit(/.claude/hooks/**),
            Edit(/.claude/skills/**),Edit(/.mcp.json),Edit(/CLAUDE.md),
            Edit(/.github/**),Edit(/.pre-commit-config.yaml)"

      - name: Claudeで実装を実行（plugin-update）
        if: env.TARGET_LABEL == 'plugin-update'
        id: claude-implement-plugin
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: 'claude'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはClaude Codeマーケットプレイスのソフトウェアエンジニアです。

            ## タスク
            Issue #${{ env.ISSUE_NUMBER }} の改善提案に基づいて、プラグインを更新してください。

            ## Issue情報
            - タイトル: (issue-title.txtを参照)
            - 本文: (issue-body.mdを参照)

            ## 実行手順

            1. issue-title.txtとissue-body.mdを読んで、改善提案の内容を把握
            2. CLAUDE.mdを読んで、プロジェクトのガイドラインを把握
            3. .claude/rules/ 配下の関連ルールドキュメントを確認
            4. 対象プラグインのファイルを確認:
               - plugin.json（.claude-plugin/plugin.json）
               - 各サブディレクトリ配下のコンポーネントファイル
            5. Issueに記載された改善内容を実装
            6. 実装完了後、pre-commitを実行してlint/formatエラーをチェック
               - `pre-commit run --all-files` を実行
               - エラーがあれば内容を確認し、該当ファイルを修正
               - 再度pre-commitを実行し、すべてパスするまで繰り返す
            7. すべてのチェックがパスしたら、変更内容のサマリーを /tmp/change-summary.txt に書き出す
               - 変更したファイル一覧と各ファイルの変更概要を箇条書きで記載
               - 例: "- plugins/my-plugin/commands/review.md: レビュー観点を追加"
            8. 変更が不要と判断した場合は、その判断理由を /tmp/no-change-reason.txt に書き出す
               - Issueが挙げた改善提案ごとに、なぜ変更が不要かを箇条書きで記載
               - 既に対応済みの場合は該当するファイルパスと記述箇所を必ず示す
               - 「特になし」「問題なし」のような根拠のない記述はしないこと

            ## プロジェクト構造
            - CLAUDE.md: プロジェクトのガイドライン（必読）
            - .claude/rules/: プラグイン仕様ドキュメント（README.mdに索引あり）
            - plugins/: プラグインディレクトリ

            ## 重要
            - CLAUDE.mdのガイドラインに従う
            - Issueの改善提案に忠実に実装する
            - 既存の動作を壊さないよう注意
            - リポジトリに永続的に必要なファイルのみ作成・変更すること
            - issue-body.md, issue-title.txt などの一時ファイルは参照のみで、変更やコミットに含めないこと

          # claude-code-updateステップと同じ設定にする。理由はそちらのコメントを参照。
          # plugins/ 配下は保護パスではないためbypassPermissionsは必須ではないが、
          # 2つのステップで権限設定が食い違うと片方だけ更新し忘れる事故が起きる。
          claude_args: >-
            --max-turns 80
            --permission-mode bypassPermissions
            --allowed-tools "Read,Grep,Glob,Edit,Write,
            Bash(uvx pytest*),Bash(uvx --with pytest-cov pytest*),Bash(uvx ruff*),
            Bash(python3 scripts/*),Bash(pre-commit run*)"
            --disallowed-tools "Edit(/.claude/settings.json),
            Edit(/.claude/settings.local.json),Edit(/.claude/hooks/**),
            Edit(/.claude/skills/**),Edit(/.mcp.json),Edit(/CLAUDE.md),
            Edit(/.github/**),Edit(/.pre-commit-config.yaml)"

      - name: 権限拒否の内訳を出力
        if: always()
        continue-on-error: true
        run: |
          LOG="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "${LOG}" ]; then
            echo "実行ログが見つかりません: ${LOG}"
            exit 0
          fi

          # 公開リポジトリのため実行ログ全体はアーティファクト化せず、
          # allowed-tools の調整に必要な「拒否されたツール呼び出し」のみを抽出する。
          # job summaryはREST APIから取得できずUIでしか読めないため、
          # 同じ内容を実行ログ（stdout）にも出して gh run view --log で追えるようにする。
          {
            echo "### 権限拒否（permission denials）の内訳"
            echo ""
            echo '```text'
            # decision_reason / decision_reason_type は permission_denials の
            # エントリ直下には存在しなかったため、エントリのキー名を併記して
            # 実際のスキーマを追えるようにする
            jq -r '[.. | objects | select(has("permission_denials")) | .permission_denials[]?]
                   | if length == 0 then "抽出結果なし"
                     else
                       .[]
                       | "\(.tool_name // "?"): \(.tool_input.command // .tool_input.file_path // "-")"
                         + "\n  エントリのキー: " + ([keys[]] | join(", "))
                     end' "${LOG}" 2>/dev/null || echo "抽出に失敗しました"
            echo '```'
            echo ""
            # 拒否の理由がルール由来かフック由来かを切り分ける。
            # 公開リポジトリのため理由の本文は出さず、種別と構造のみを出力する。
            echo "### 拒否理由の種別"
            echo ""
            echo '```text'
            jq -r '[.. | objects | select(has("decision_reason_type"))]
                   | if length == 0 then "decision_reason_type を含むオブジェクトなし"
                     else
                       .[]
                       | "種別: \(.decision_reason_type // "-")"
                         + "  ツール: \(.tool_name // .name // "-")"
                         + "  理由の構造: "
                         + ((.decision_reason // null)
                            | if type == "object" then "object{" + (keys | join(", ")) + "}"
                              elif type == "string" then "string(\(length)文字)"
                              elif . == null then "-"
                              else type end)
                     end' "${LOG}" 2>/dev/null | sort | uniq -c || echo "抽出に失敗しました"
            echo '```'
            echo ""
            # 抽出できなかった場合に構造を追えるよう、キー名のみ（値は出さない）を併記する
            echo "<details><summary>実行ログのキー名一覧</summary>"
            echo ""
            echo '```text'
            jq -r '[.. | objects | keys[]] | unique | join(", ")' "${LOG}" 2>/dev/null | head -c 2000
            echo ""
            echo '```'
            echo ""
            echo "</details>"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: 変更があるか確認
        id: check-changes
        run: |
          # Issue取得ステップが作った一時ファイルはコミット対象外のため先に削除する。
          # 残したままだとuntrackedとして検出され、常に「変更あり」になってしまう。
          rm -f issue-body.md issue-title.txt

          # git diff は追跡済みファイルの変更しか見ないため、新規ファイルの追加だけを
          # 行ったケース（テストファイルの新規作成など）を「変更なし」と誤判定していた。
          # 後続のcommitは git add -A で行うため、判定もuntrackedを含む状態に揃える。
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "変更なし"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "変更あり"
            git status --porcelain
          fi

      - name: pre-commitで最終検証
        id: verify
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          # このワークフローのrunステップは既定シェル（bash -e）で実行されpipefailが
          # 無効なため、明示しないと `pre-commit | tee` の終了ステータスがteeの0になり
          # pre-commitの失敗を検知できない
          set -o pipefail

          echo "=== 最終検証: pre-commit実行 ==="
          # 一時ファイルを除外してステージング
          rm -f issue-body.md issue-title.txt
          git add -A

          # 機密情報の検出は成果保全より優先する。gitleaksが検出した場合は
          # commit・push・PR作成のいずれも行わずジョブを中止する。
          # 公開リポジトリのため、検出内容がブランチやPR本文・実行ログに
          # 載らないよう、gitleaksの出力は表示せずファイルに退避する。
          if ! pre-commit run gitleaks --all-files > /tmp/gitleaks.log 2>&1; then
            echo "::error::機密情報が検出されました。commit・pushを行わず中止します。"
            echo "検出内容は公開を避けるため出力しません。"
            echo "ローカルで 'pre-commit run gitleaks --all-files' を実行して確認してください。"
            exit 1
          fi

          # pre-commit実行（自動修正があれば適用）
          if ! pre-commit run --all-files 2>&1 | tee /tmp/precommit.log; then
            echo "自動修正が適用されました。再度ステージングして検証します。"
            git add -A
            # 2回目の実行
            if ! pre-commit run --all-files 2>&1 | tee /tmp/precommit.log; then
              # 万一この段階でgitleaksが検出した場合、ログをPR本文に埋め込むと
              # 検出内容が公開されるため、ログを破棄してジョブを中止する
              if grep -q '^Detect hardcoded secrets\.*Failed' /tmp/precommit.log; then
                rm -f /tmp/precommit.log
                echo "::error::機密情報が検出されました。commit・pushを行わず中止します。"
                echo "ローカルで 'pre-commit run gitleaks --all-files' を実行して確認してください。"
                exit 1
              fi

              # ここでジョブを落とすとClaudeの実装結果がpushされず完全に失われるため、
              # 結果だけを記録して後続のpush・Draft PR作成に進む。
              # E501のようにruffが自動修正できない違反は再実行しても解消しない。
              echo "::warning::pre-commitチェックが未通過です。Draft PRとして作成します。"
              echo "status=fail" >> "$GITHUB_OUTPUT"
              git status
              exit 0
            fi
          fi
          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "✓ すべてのpre-commitチェックがパスしました"

      # GITHUB_TOKENで作成したPRではCIワークフローが自動起動しないため、
      # test-scripts.yml と同等のテストをこのジョブ内で実行する。
      # これがないと、テストが壊れた変更がノーチェックのままPRとして並ぶ。
      - name: テストを実行
        id: test
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          set -o pipefail

          # test-scripts.yml と同じく scripts/ に変更がある場合のみ実行する
          if [ -z "$(git status --porcelain -- scripts)" ]; then
            echo "scripts/ に変更がないためテストをスキップします"
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd scripts
          # 失敗してもここでジョブを落とさない。pre-commit未通過時と同様に、
          # 結果だけ記録してDraft PRとして成果を残す。
          if ! uvx --with pytest-cov pytest tests/ -v \
                 --cov=validators --cov-report=term --cov-fail-under=100 \
                 2>&1 | tee /tmp/pytest.log; then
            echo "::warning::テストまたはカバレッジ100%要件が未通過です。Draft PRとして作成します。"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=pass" >> "$GITHUB_OUTPUT"
          echo "✓ テストとカバレッジ要件がパスしました"

      # Draft判定の条件を1か所に集約する。判定箇所が散らばると、
      # チェックを追加したときに一部だけ更新し忘れる事故が起きる。
      - name: 検証結果を集約
        id: gate
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          if [ "${{ steps.verify.outputs.status }}" = "fail" ] \
             || [ "${{ steps.test.outputs.status }}" = "fail" ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "検証未通過: Draft PRとして作成します"
          else
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "検証通過: 通常のPRとして作成します"
          fi

      - name: 変更をコミットしてプッシュ
        id: push
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          set -e
          # 一時ファイルを削除（コミットに含めないため）
          rm -f issue-body.md issue-title.txt
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A

          # ラベルに応じてコミットメッセージを変更
          if [ "${TARGET_LABEL}" = "claude-code-update" ]; then
            COMMIT_DESC="Claude Codeのアップデートに伴うドキュメント・バリデーター更新"
          else
            COMMIT_DESC="ルール更新に伴うプラグイン改善"
          fi

          # 直前のステップでpre-commitを明示実行済み。かつpre-commit未通過でも
          # Draft PRとして成果を残す設計のため、コミットフックは意図的にスキップする
          # （pre-commit installされているため--no-verifyがないとcommitがブロックされる）
          git commit --no-verify -m "feat: Issue #${ISSUE_NUMBER} の自動実装

          ${COMMIT_DESC}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>"

          # デバッグ情報を出力
          echo "=== デバッグ情報 ==="
          echo "ブランチ名: ${{ steps.branch.outputs.name }}"
          git remote -v
          echo "==================="

          # 明示的にトークンを使用してリモートURLを設定
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # 前回の実行でブランチが残っている場合があるためforce push
          if ! git push -u --force origin ${{ steps.branch.outputs.name }}; then
            echo "::error::git push に失敗しました"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ラベルが存在しない場合は作成
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          # PRに付与するラベルが存在するか確認し、なければ作成
          for LABEL in "${TARGET_LABEL}" "${{ steps.config.outputs.pr_label }}"; do
            if ! gh label list --json name --jq '.[].name' | grep -q "^${LABEL}$"; then
              echo "ラベル '${LABEL}' が存在しないため作成します"
              gh label create "${LABEL}" --description "自動生成されたラベル" || true
            else
              echo "ラベル '${LABEL}' は既に存在します"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PRを作成
        id: pr
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          # ISSUE_TITLEはユーザー制御可能なため、env経由で安全に渡す
          ISSUE_NUM="${ISSUE_NUMBER}"

          # Issueタイトルが空の場合のフォールバック
          if [ -z "$ISSUE_TITLE" ]; then
            PR_TITLE="feat: Issue #${ISSUE_NUM} の自動実装"
          # [CHANGELOG vX.X.X] 形式の場合はそのまま使用
          elif [[ "$ISSUE_TITLE" =~ ^\[CHANGELOG\ v[0-9]+\.[0-9]+\.[0-9]+\] ]]; then
            PR_TITLE="$ISSUE_TITLE"
          # [プラグイン改善] 形式の場合はそのまま使用
          elif [[ "$ISSUE_TITLE" =~ ^\[プラグイン改善\] ]]; then
            PR_TITLE="$ISSUE_TITLE"
          else
            PR_TITLE="feat: $ISSUE_TITLE"
          fi

          # Claude Codeが出力した変更サマリーファイルを読み込む
          if [ -f "/tmp/change-summary.txt" ]; then
            CHANGE_SUMMARY=$(cat /tmp/change-summary.txt)
          else
            CHANGE_SUMMARY=""
          fi

          # 変更サマリーが空の場合のフォールバック
          if [ -z "$CHANGE_SUMMARY" ]; then
            CHANGE_SUMMARY="Claude Actionによって自動生成された変更です。詳細はコミット履歴を参照してください。"
          fi

          # 検証未通過のPRは誤マージでIssueが自動クローズされないよう Refs にする
          if [ "${{ steps.gate.outputs.status }}" = "fail" ]; then
            ISSUE_REF="Refs #${ISSUE_NUM}"
          else
            ISSUE_REF="Closes #${ISSUE_NUM}"
          fi

          # PR本文をファイルに書き込む（シェルエスケープの問題を回避）
          if [ "${TARGET_LABEL}" = "claude-code-update" ]; then
            {
              echo "## 概要"
              echo "Issue #${ISSUE_NUM}: ${ISSUE_TITLE}"
              echo ""
              echo "Claude Codeのアップデートに対応します。"
              echo ""
              echo "## 関連Issue"
              echo "${ISSUE_REF}"
              echo ""
              echo "## 変更内容"
              echo "$CHANGE_SUMMARY"
              echo ""
              echo "## 確認事項"
              echo "- [ ] ドキュメントの変更が適切か"
              echo "- [ ] バリデーターが正しく動作するか"
              echo "- [ ] テストが通過するか"
              echo ""
              echo "---"
              echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            } > /tmp/pr-body.md
          else
            {
              echo "## 概要"
              echo "Issue #${ISSUE_NUM}: ${ISSUE_TITLE}"
              echo ""
              echo "プラグイン改善提案を実装します。"
              echo ""
              echo "## 関連Issue"
              echo "${ISSUE_REF}"
              echo ""
              echo "## 変更内容"
              echo "$CHANGE_SUMMARY"
              echo ""
              echo "## 確認事項"
              echo "- [ ] プラグインの変更が適切か"
              echo "- [ ] 既存の動作に影響がないか"
              echo ""
              echo "---"
              echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            } > /tmp/pr-body.md
          fi

          # 検証未通過の場合はDraft PRにし、失敗ログを本文に添える
          DRAFT_FLAG=""
          if [ "${{ steps.gate.outputs.status }}" = "fail" ]; then
            DRAFT_FLAG="--draft"
          fi
          if [ "${{ steps.verify.outputs.status }}" = "fail" ]; then
            {
              echo ""
              echo "## ⚠️ pre-commit未通過"
              echo ""
              echo "自動修正では解消できないチェック違反が残っています。手動修正が必要です。"
              echo ""
              echo '```text'
              tail -60 /tmp/precommit.log
              echo '```'
            } >> /tmp/pr-body.md
          fi
          if [ "${{ steps.test.outputs.status }}" = "fail" ]; then
            {
              echo ""
              echo "## ⚠️ テスト未通過"
              echo ""
              echo "テストの失敗、またはカバレッジ100%要件の未達があります。手動修正が必要です。"
              echo ""
              echo '```text'
              tail -60 /tmp/pytest.log
              echo '```'
            } >> /tmp/pr-body.md
          fi

          # 作業ブランチ名はIssue番号から決まり、pushはforce pushで行うため、
          # 再実行時は既存PRがそのまま更新される。この状態で gh pr create を
          # 呼ぶと「既にPRが存在する」で落ち、成果はpush済みなのに
          # 「失敗しました」コメントとラベルが付いてしまう。
          EXISTING_PR=$(gh pr list --head "${{ steps.branch.outputs.name }}" \
            --state open --json number --jq '.[0].number // empty')

          if [ -n "${EXISTING_PR}" ]; then
            echo "既存のPR #${EXISTING_PR} を更新します"
            gh pr edit "${EXISTING_PR}" --title "$PR_TITLE" --body-file /tmp/pr-body.md
            # 再実行で検証結果が変わった場合にDraft状態を追従させる
            if [ -n "$DRAFT_FLAG" ]; then
              gh pr ready "${EXISTING_PR}" --undo
            else
              gh pr ready "${EXISTING_PR}"
            fi
            echo "number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
            echo "action=updated" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # shellcheck disable=SC2086
          PR_URL=$(gh pr create $DRAFT_FLAG \
            --title "$PR_TITLE" \
            --body-file /tmp/pr-body.md \
            --label "${TARGET_LABEL}" \
            --label "${{ steps.config.outputs.pr_label }}")
          echo "作成しました: ${PR_URL}"
          echo "number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
          echo "action=created" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}

      - name: Issueにコメントを追加（変更あり）
        if: steps.gate.outputs.status == 'pass'
        continue-on-error: true
        run: |
          # 再実行では既存PRを更新するため、実際に行った操作を反映する
          if [ "${{ steps.pr.outputs.action }}" = "updated" ]; then
            ACTION_TEXT="既存のPR #${{ steps.pr.outputs.number }} を更新しました"
          else
            ACTION_TEXT="PR #${{ steps.pr.outputs.number }} を作成しました"
          fi

          gh issue comment "${ISSUE_NUMBER}" --body "🤖 **自動実装完了**

          ${ACTION_TEXT}。レビューをお願いします。

          ---
          *このコメントはClaude Code自動更新対応ワークフローによって生成されました*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Issueにコメントを追加（Draft PR作成）
        if: steps.gate.outputs.status == 'fail'
        continue-on-error: true
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "🤖 **Draft PR #${{ steps.pr.outputs.number }}**

          実装は完了しましたが、pre-commitまたはテストが未通過のためDraft PRになっています。
          自動修正では解消できないため、手動修正が必要です。
          詳細はPR本文のログを参照してください。

          ---
          *このコメントはClaude Code自動更新対応ワークフローによって生成されました*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 「変更なし」で終わったIssueはPRもラベルも付かず放置されやすい。
      # 判断が妥当かを人が確認できるよう、Claudeが書いた根拠をコメントに載せる。
      - name: Issueにコメントを追加（変更なし）
        if: steps.check-changes.outputs.has_changes == 'false'
        continue-on-error: true
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "🤖 **自動実装結果: 変更なし**"
            echo ""
            echo "Issueの内容を分析しましたが、変更が必要な箇所は見つかりませんでした。"
            echo ""
            if [ -s /tmp/no-change-reason.txt ]; then
              echo "## 判断理由"
              echo ""
              cat /tmp/no-change-reason.txt
            else
              echo "> ⚠️ 判断理由が記録されていません。実装が途中で打ち切られた可能性があります。"
              echo ">"
              echo "> 実行ログ: ${RUN_URL}"
            fi
            echo ""
            echo "判断が妥当であればIssueをクローズし、そうでなければ手動で対応してください。"
            echo ""
            echo "---"
            echo "*このコメントはClaude Code自動更新対応ワークフローによって生成されました*"
          } > /tmp/no-change-comment.md

          gh issue comment "${ISSUE_NUMBER}" --body-file /tmp/no-change-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ジョブが途中で失敗した場合、従来はIssueに何も残らず放置されていたため通知する。
      # 権限チェック（オーナー以外がラベルを付けたケース）で失敗した場合は
      # Issueにコメントを残さないよう、ブランチ作成まで到達したかで条件を絞る。
      # なお pre-commitまたはテストが未通過なだけの場合は、Draft PRを作った上で
      # ジョブ末尾まで成功状態で進む。このステップは発火せず
      # 「Draft PR」コメントのみが残る。
      - name: Issueに失敗を通知
        if: failure() && steps.branch.outcome == 'success'
        continue-on-error: true
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "🤖 **自動実装に失敗しました**"
            echo ""
            echo "- 実行ログ: ${RUN_URL}"
            # 作業ブランチはpushステップが成功した場合のみリモートに存在する。
            # Claudeの実行失敗などpush前に落ちた場合は、案内しても存在しない。
            if [ "${{ steps.push.outcome }}" = "success" ]; then
              echo "- 作業ブランチ: \`${{ steps.branch.outputs.name }}\`（push済み）"
            else
              echo "- 作業ブランチはpushされていないため、実装内容は残っていません"
            fi
            echo ""
            echo "手動での対応が必要です。原因を解消したうえでラベルを付け直すと再実行されます。"
            echo ""
            echo "---"
            echo "*このコメントはClaude Code自動更新対応ワークフローによって生成されました*"
          } > /tmp/fail-comment.md

          gh issue comment "${ISSUE_NUMBER}" --body-file /tmp/fail-comment.md

          # 失敗したIssueを一覧で絞り込めるようラベルを付与する
          gh label create auto-implement-failed \
            --color d73a4a \
            --description "自動実装が失敗したIssue" 2>/dev/null || true
          gh issue edit "${ISSUE_NUMBER}" --add-label auto-implement-failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 成果（Draft PR）を残したうえで、run自体は赤くして見落としを防ぐ。
      # 必ずPR作成・通知ステップより後に置くこと。
      - name: 検証未通過ならジョブを失敗させる
        if: steps.gate.outputs.status == 'fail'
        run: |
          echo "::error::検証未通過のDraft PRを作成しました。手動修正が必要です。"
          exit 1
